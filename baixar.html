<style>
  :root{
    --bg:#160F10; --surface:#1F1618; --ink:#F1E7DA; --muted:#9C8A7C;
    --gold:#E3C877; --line:rgba(241,231,218,.14); --wine:#3A1118; --glow:#782A38;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(120% 90% at 72% 115%, rgba(120,42,56,.55), transparent 60%),
      var(--wine);
    color:var(--ink);
    font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 22px;text-align:center;
  }
  .brand{display:flex;align-items:center;gap:9px;color:var(--gold);font-weight:600;
    font-size:12px;letter-spacing:3px;justify-content:center;margin-bottom:26px}
  .brand .d{width:5px;height:5px;background:var(--gold);transform:rotate(45deg)}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(32px,7.5vw,52px);
    margin:0 0 12px;letter-spacing:.3px;line-height:1.1}
  .sub{color:var(--muted);font-size:clamp(14.5px,3.8vw,17px);max-width:440px;margin:0 auto 34px}
  .glass{height:clamp(150px,34vw,196px);width:auto;margin:0 auto 20px;display:block;opacity:.96}
  .stores{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:11px;background:var(--surface);
    color:var(--ink);text-decoration:none;padding:12px 22px;border-radius:16px;
    border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35);
    transition:transform .12s ease,border-color .2s ease}
  .btn:hover{border-color:var(--gold)}
  .btn:active{transform:scale(.97)}
  .btn .ic{width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex:none}
  .btn .lbl{display:flex;flex-direction:column;line-height:1.15;text-align:left}
  .btn .lbl small{font-size:10.5px;color:var(--muted);letter-spacing:.4px;font-weight:500}
  .btn .lbl b{font-size:16px;font-weight:600;letter-spacing:.2px}
  footer{margin-top:46px;color:var(--muted);font-size:12.5px}
  footer a{color:var(--muted)}
</style>
