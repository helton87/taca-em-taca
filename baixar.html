<style>

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:

    color:var(--ink);

  .brand .d{width:5px;height:5px;background:var(--gold);transform:rotate(45deg)}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(34px,8vw,56px);
    margin:0 0 10px;letter-spacing:.3px;line-height:1.08}
  .sub{color:var(--muted);font-size:clamp(15px,4vw,18px);max-width:460px;margin:0 auto 34px}
  .glass{height:clamp(150px,34vw,196px);width:auto;margin:0 auto 20px;display:block;opacity:.96}
  .btn{display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:#2A1C07;
    font-weight:600;font-size:16px;text-decoration:none;padding:15px 26px;border-radius:999px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .12s ease}
  .btn:active{transform:scale(.97)}
  .soon{color:var(--muted);font-size:13px;margin-top:18px}
  footer{margin-top:46px;color:var(--muted);font-size:12.5px}
